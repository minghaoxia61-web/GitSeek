services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openscout
      POSTGRES_USER: openscout
      POSTGRES_PASSWORD: openscout
    ports:
      - "5432:5432"
    volumes:
      - openscout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscout -d openscout"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      OPENSCOUT_DATABASE_URL: postgresql+psycopg://openscout:openscout@postgres:5432/openscout
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  openscout-postgres:
