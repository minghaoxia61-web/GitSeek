name: Build Windows desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public FastAPI base URL, without a trailing slash
        required: true
        type: string
      web_app_url:
        description: Latest hosted GitSeek interface loaded by the installed app
        required: true
        default: https://openscout-gitseek.minghaoxia61.chatgpt.site
        type: string
      app_version:
        description: Application version using MAJOR.MINOR.PATCH
        required: true
        default: 0.1.0
        type: string
      publish_release:
        description: Publish installers as a stable GitHub Release
        required: true
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install frontend dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Install desktop dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Configure public API address
        shell: pwsh
        env:
          DESKTOP_API_BASE_URL: ${{ inputs.api_base_url || vars.GITSEEK_API_BASE_URL || 'https://git-seek-swart.vercel.app' }}
          DESKTOP_WEB_APP_URL: ${{ inputs.web_app_url || 'https://openscout-gitseek.minghaoxia61.chatgpt.site' }}
        run: |
          @(
            "VITE_API_BASE_URL=$env:DESKTOP_API_BASE_URL"
            "VITE_REMOTE_APP_URL=$env:DESKTOP_WEB_APP_URL"
          ) | Set-Content apps/web/.env.desktop

      - name: Set application version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.app_version || github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION.TrimStart("v")
          pnpm --dir apps/desktop run version:set -- $version

      - name: Build NSIS and MSI installers
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "gitseek-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $configPath = Join-Path $env:RUNNER_TEMP "tauri-signing.json"
            @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Depth 5 | Set-Content $configPath
            pnpm --dir apps/desktop tauri build --config $configPath
          } else {
            Write-Output "No Windows signing certificate configured; producing unsigned installers."
            pnpm --dir apps/desktop run build
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          Get-ChildItem $bundleRoot -Recurse -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content "$bundleRoot/SHA256SUMS.txt"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: GitSeek-Windows
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Publish stable GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.app_version || github.ref_name }}
        run: |
          $version = $env:REQUESTED_VERSION.TrimStart("v")
          $tag = "v$version"
          $bundleRoot = "apps/desktop/src-tauri/target/release/bundle"
          gh release create $tag --title "GitSeek $version" --generate-notes --notes "GitSeek 的首个稳定版本。普通用户建议下载 NSIS setup.exe；SHA256SUMS.txt 可用于校验文件完整性。"
          Get-ChildItem $bundleRoot -Recurse -File | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }
