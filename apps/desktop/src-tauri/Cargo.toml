[package]
name = "gitseek"
version = "0.1.0"
description = "Evidence-backed GitHub project discovery desktop client"
authors = ["GitSeek contributors"]
edition = "2021"

[lib]
name = "gitseek_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
